<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Winner Predictor</title>
<style>
:root{--bg:#fcfcfb;--card:#fff;--ink:#0b0b0b;--ink2:#52514e;--line:#e4e3df;--blue:#2a78d6;--orange:#eb6834;--green:#1baf7a}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a19;--card:#232321;--ink:#fff;--ink2:#c3c2b7;--line:#3a3a37;--blue:#3987e5;--orange:#d95926;--green:#199e70}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}h1{font-size:26px;margin:8px 0 2px}.sub{color:var(--ink2);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{font-size:22px;display:block}.stat span{color:var(--ink2);font-size:13px}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:150px 1fr 54px 64px;gap:8px;align-items:center;padding:4px 0}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.team{color:var(--ink2);font-size:12px}
.bar{height:16px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.win i{background:var(--green)}.pct{text-align:right;font-variant-numeric:tabular-nums}
input[type=number]{width:60px;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{font:inherit;padding:8px 14px;border-radius:8px;border:0;background:var(--blue);color:#fff;cursor:pointer;margin-right:6px}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--line);font-size:12px;margin-left:6px}
.note{color:var(--ink2);font-size:13px;margin:8px 0}h2{font-size:18px;margin:0 0 8px}
@media(max-width:600px){.row{grid-template-columns:110px 1fr 46px 56px}}
</style></head><body><main>
<h1>F1 Winner Predictor</h1>
<p class="sub">Calibrated win probabilities, tested race by race with no peeking at the future.</p>
<div class="stats" id="stats"></div>
<div class="card" style="margin-bottom:14px"><label for="race" class="note">Pick a race</label><select id="race"></select></div>
<div id="frozen"></div>
<div class="card"><h2 id="title"></h2><div class="note" id="src"></div><div id="rows"></div></div>
<div class="card" style="margin-top:14px"><h2>What if the grid were different?</h2>
<p class="note">Edit starting positions (each slot used once), then re-predict. Swap two drivers to see how much a grid slot is worth.</p>
<div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px"></div>
<p><button id="go">Re-predict</button><button class="alt" id="reset">Reset</button></p><div id="wi"></div></div>
</main>
<script>
const $=s=>document.querySelector(s),pc=p=>(p*100).toFixed(p<.1?1:0)+'%';let cur=null;
async function j(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error((await r.json()).detail||r.status);return r.json()}
function rows(ds,el,show){el.innerHTML=ds.slice(0,show).map(d=>`<div class="row ${d.won?'win':''}"><div class="name">${d.name}<div class="team">${d.team||''} · P${d.grid}</div></div><div class="bar"><i style="width:${Math.min(100,d.p*100/(ds[0].p||1))}%"></i></div><div class="pct">${pc(d.p)}</div><div class="team">${d.won?'WON':''}</div></div>`).join('')}
async function load(k){const r=await j('/api/race/'+k);cur=r;
 $('#title').innerHTML=r.name+' '+r.date.slice(0,4)+(r.winner?`<span class="badge">winner: ${r.winner}</span>`:'<span class="badge">upcoming</span>');
 $('#src').textContent='Source: '+r.source;rows(r.drivers,$('#rows'),12);
 $('#frozen').innerHTML=r.frozen?`<div class="card" style="margin-bottom:14px;border-color:var(--orange)"><b>Frozen before the race</b> <span class="note">${r.frozen.generated_utc.slice(0,16)} UTC, commit ${r.frozen.git_commit}</span>${r.frozen.result?`<div>Result: ${r.frozen.result.winner} had ${pc(r.frozen.result.p_assigned||0)}</div>`:'<div class="note">Awaiting the race result.</div>'}</div>`:'';
 const g=[...r.drivers].sort((a,b)=>a.grid-b.grid);$('#grid').innerHTML=g.map(d=>`<label>${d.name.split(' ').pop()} <input type="number" min="1" max="22" data-id="${d.id}" value="${d.grid}" data-orig="${d.grid}"></label>`).join('');$('#wi').innerHTML=''}
$('#go').onclick=async()=>{const grid={};document.querySelectorAll('#grid input').forEach(i=>grid[i.dataset.id]=+i.value);
 try{const w=await j('/api/race/'+cur.key+'/whatif',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grid})});
 rows(w.drivers.map(d=>({...d,team:''})),$('#wi'),8);$('#wi').insertAdjacentHTML('beforeend',`<div class="note">${w.note}</div>`)}catch(e){$('#wi').innerHTML='<div class="note" style="color:var(--orange)">'+e.message+'</div>'}};
$('#reset').onclick=()=>{document.querySelectorAll('#grid input').forEach(i=>i.value=i.dataset.orig);$('#wi').innerHTML=''};
(async()=>{const s=await j('/api/summary');const c=(t,v,x)=>`<div class="card stat"><b>${v}</b><span>${t}</span></div>`;
 $('#stats').innerHTML=c('races backtested',s.races)+c('top-pick accuracy, grid only',Math.round(s.grid_only.top1*100)+'%')+c('top-pick accuracy, full model',Math.round(s.full_model.top1*100)+'%')+c('winner log-loss (grid → full)',s.grid_only.logloss+' → '+s.full_model.logloss);
 const rs=await j('/api/races');$('#race').innerHTML=rs.map(r=>`<option value="${r.key}">${r.season} ${r.name}${r.winner?'':' (upcoming)'}${r.frozen?' ★':''}</option>`).join('');
 $('#race').onchange=e=>load(e.target.value);load(rs[0].key)})();
</script></body></html>
